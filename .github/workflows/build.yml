name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Fenestra-win-x64
          path: bin/Fenestra.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        working-directory: linux
        run: go test ./...

      - name: Build amd64
        working-directory: linux
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../bin/fenestra-linux-amd64 .

      - name: Build arm64
        working-directory: linux
        run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../bin/fenestra-linux-arm64 .

      - name: Smoke test the binary
        run: |
          mkdir -p /tmp/fixture/assets
          printf '<!doctype html><script type="module" src="/assets/app.js"></script><h1>ok</h1>' > /tmp/fixture/index.html
          printf 'console.log(1)' > /tmp/fixture/assets/app.js
          FENESTRA_NO_OPEN=1 ./bin/fenestra-linux-amd64 /tmp/fixture/index.html &
          sleep 2
          PORT=$(cat ~/.local/share/fenestra/sessions/*.txt | head -1 | cut -d'|' -f1)
          echo "porta $PORT"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q "ok"
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/assets/app.js"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/nao-existe.png")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://127.0.0.1:$PORT/../secret/")" = "403"
          echo "linux smoke ok"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fenestra-linux
          path: |
            bin/fenestra-linux-amd64
            bin/fenestra-linux-arm64
          if-no-files-found: error

  macos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        working-directory: macos
        run: go vet ./...

      - name: Build arm64
        working-directory: macos
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../bin/fenestra-darwin-arm64 .

      - name: Build amd64
        working-directory: macos
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../bin/fenestra-darwin-amd64 .

      - name: Check Mach-O
        run: |
          file bin/fenestra-darwin-arm64 | grep -q "Mach-O"
          file bin/fenestra-darwin-amd64 | grep -q "Mach-O"
          echo "mach-o ok"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: fenestra-macos
          path: bin/fenestra-darwin-*
          if-no-files-found: error
