name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: VERSION and the site agree
        run: |
          V=$(cat VERSION)
          grep -q "?v=$V" docs/index.html
          grep -q "v$V" docs/app.js
          echo "version $V is consistent"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          cd linux && staticcheck ./...
          cd ../macos && staticcheck ./...

      - name: gosec (reviewed exclusions G115, G204, G304, G703)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd linux && gosec -quiet -severity=medium -exclude=G115,G204,G304,G703 ./...

  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fenestra-win-x64
          path: bin/Fenestra.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Test
        working-directory: linux
        run: go test -race ./...

      - name: Build amd64
        working-directory: linux
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o ../bin/fenestra-linux-amd64 .

      - name: Build arm64
        working-directory: linux
        run: CGO_ENABLED=0 GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o ../bin/fenestra-linux-arm64 .

      - name: Smoke test the binary
        run: |
          mkdir -p /tmp/fixture/assets
          printf '<!doctype html><script type="module" src="/assets/app.js"></script><h1>ok</h1>' > /tmp/fixture/index.html
          printf 'console.log(1)' > /tmp/fixture/assets/app.js
          FENESTRA_NO_OPEN=1 ./bin/fenestra-linux-amd64 /tmp/fixture/index.html &
          sleep 2
          PORT=$(cat ~/.local/share/fenestra/sessions/*.txt | head -1 | cut -d'|' -f1)
          echo "porta $PORT"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q "ok"
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/assets/app.js"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/nao-existe.png")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://127.0.0.1:$PORT/../secret/")" = "403"
          echo "linux smoke ok"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fenestra-linux
          path: |
            bin/fenestra-linux-amd64
            bin/fenestra-linux-arm64
          if-no-files-found: error

  macos:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Vet
        working-directory: linux
        run: go vet ./...

      - name: Build arm64
        working-directory: linux
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o ../bin/fenestra-darwin-arm64 .

      - name: Build amd64
        working-directory: linux
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$(cat ../VERSION)" -o ../bin/fenestra-darwin-amd64 .

      - name: Check Mach-O
        run: |
          file bin/fenestra-darwin-arm64 | grep -q "Mach-O"
          file bin/fenestra-darwin-amd64 | grep -q "Mach-O"
          echo "mach-o ok"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fenestra-macos
          path: bin/fenestra-darwin-*
          if-no-files-found: error

  macos-native:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable

      - name: Run the user-facing build kit
        working-directory: macos
        run: |
          bash build.command
          test -x fenestra
          test -d Fenestra.app
          file fenestra | grep -q "Mach-O"
          file Fenestra.app/Contents/Resources/fenestra | grep -q "Mach-O"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:LSItemContentTypes:0" Fenestra.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Fenestra.app/Contents/Info.plist)" = "dev.fenestra.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Fenestra.app/Contents/Info.plist)" != ""
          test -f Fenestra.app/Contents/Resources/droplet.icns
          ./fenestra --browsers | grep -qi safari

      - name: Verify the code signature
        working-directory: macos
        run: |
          codesign --verify --deep --strict --verbose=2 Fenestra.app
          echo "assinatura valida"

      - name: Smoke test the binary on macOS
        run: |
          mkdir -p /tmp/fixture/assets
          printf '<!doctype html><script type="module" src="/assets/app.js"></script><h1>ok</h1>' > /tmp/fixture/index.html
          printf 'console.log(1)' > /tmp/fixture/assets/app.js
          FENESTRA_NO_OPEN=1 ./macos/fenestra /tmp/fixture/index.html &
          sleep 2
          PORT=$(cat "$HOME/Library/Application Support/Fenestra/sessions/"*.txt | head -1 | cut -d'|' -f1)
          echo "porta $PORT"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q ok
          curl -fsS -o /dev/null "http://127.0.0.1:$PORT/assets/app.js"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:$PORT/nao-existe.png")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "http://127.0.0.1:$PORT/../secret/")" = "403"
          echo "macos smoke ok"

      - name: Check signature of the built binary
        run: |
          codesign -dv --verbose=2 macos/fenestra 2>&1 || true
          codesign -dv --verbose=2 macos/Fenestra.app 2>&1 || true

      - name: Droplet end-to-end
        run: |
          mkdir -p /tmp/fixture2
          printf '<!doctype html><h1>droplet</h1>' > /tmp/fixture2/index.html
          LOG="$HOME/Library/Application Support/Fenestra/fenestra.log"
          open -a "$PWD/macos/Fenestra.app" /tmp/fixture2/index.html
          sleep 6
          grep -q "fixture2" "$LOG"
          PORT=$(grep "serving /private/tmp/fixture2" "$LOG" | tail -1 | sed 's/.*://')
          echo "porta do droplet: $PORT"
          curl -fsS "http://127.0.0.1:$PORT/" | grep -q droplet
          echo "droplet ok"

      - name: Upload the app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Fenestra-app-macos
          path: macos/Fenestra.app
          if-no-files-found: error
