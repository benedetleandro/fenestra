name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Test
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./tests/run-tests.ps1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: Fenestra-win-x64
          path: bin/Fenestra.exe
          if-no-files-found: error
